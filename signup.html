
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VALAM - Create Account</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <!-- NAVBAR -->
    <nav class="login-navbar">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-2">
                <div class="brand-icon">V</div>
                <div>
                    <div class="brand-name">VALAM</div>
                    <div class="brand-tagline">Supply Management System</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- SIGNUP FORM -->
    <main class="login-main">
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="portal-card">

                        <p class="portal-label">NEW USER REGISTRATION</p>

                        <h2 class="portal-title">Create your account</h2>

                        <p class="portal-subtitle">
                            Register to access your VALAM workspace.
                        </p>

                        <form id="signupForm">

                            <!-- USERNAME -->
                            <div class="mb-3">
                                <label class="form-label">Username</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="signupUsername"
                                    placeholder="Enter username"
                                    required>
                            </div>

                            <!-- PASSWORD -->
                            <div class="mb-3">
                                <label class="form-label">Password</label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="signupPassword"
                                    placeholder="Create password"
                                    required>
                            </div>

                            <!-- ROLE -->
                            <div class="mb-3">
                                <label class="form-label">Select Role</label>

                                <select class="form-select"
                                    id="signupRole" required>

                                    <option value="">Choose your role</option>
                                    <option value="SHOP">Shop</option>
                                    <option value="WAREHOUSE">Warehouse</option>

                                </select>
                            </div>
                                                        

                            <!-- MESSAGE -->
                            <div id="signupMessage"
                                class="alert"
                                style="display:none;">
                            </div>

                            <!-- SUBMIT -->
                            <button type="submit"
                                class="btn w-100 mt-2"
                                style="background:#176b52; color:white; padding:12px; border-radius:10px; font-weight:600;">

                                Create Account

                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account?
                            <a href="index.html">Sign in</a>
                        </p>

                    </div>

                </div>

            </div>

        </div>
    </main>

    <footer class="login-footer">
        <p>&copy; VALAM - Supply Management System 2026</p>
    </footer>

    <script src="signup.js"></script>
    
</body>
</html>
